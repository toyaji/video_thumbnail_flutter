name: PR Validation

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  FLUTTER_VERSION: "3.50.1"

jobs:
  lint_and_test:
    name: Lint & Test (Flutter ${{ matrix.flutter }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # pubspec의 최소 Flutter 버전과 CI 기준 버전
        flutter: ["3.44.0", "3.50.1"]
    steps:
      - uses: actions/checkout@v7

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ matrix.flutter }}
          cache: true

      - name: Install dependencies
        run: flutter pub get --no-example

      - name: Prevent lint ignores
        run: |
          if grep -rn 'ignore_for_file' lib/ test/ example/lib/ example/test/ example/integration_test/; then
            echo "::error::Fix the lint instead of adding ignore_for_file."
            exit 1
          fi

      - name: Analyze & test package
        run: |
          flutter analyze lib test
          flutter test

      # 예제 앱은 최신 템플릿(Dart 3.14)이라 CI 기준 버전에서만 검사한다.
      - name: Analyze & test example
        if: matrix.flutter == env.FLUTTER_VERSION
        working-directory: example
        run: |
          flutter pub get
          flutter analyze
          flutter test

      # dart format은 패키지의 Dart 언어 버전으로 스타일을 정하므로 예제 의존성을 받은 뒤에 돌린다.
      - name: Format
        if: matrix.flutter == env.FLUTTER_VERSION
        run: dart format --output=none --set-exit-if-changed lib test example/lib example/test example/integration_test

  android_build:
    name: Android Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: zulu
          java-version: "21"

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: Build Android example
        working-directory: example
        run: flutter build apk --release

  ios_spm_build:
    name: iOS Build (Swift Package Manager)
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v7

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: Build iOS example with SPM only
        working-directory: example
        run: |
          flutter config --enable-swift-package-manager
          test ! -e ios/Podfile
          flutter build ios --no-codesign
          test ! -e ios/Podfile

  pub_publish_check:
    name: pub.dev Publishing Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: Install dependencies
        run: flutter pub get --no-example

      - name: Verify pub.dev publishing
        run: flutter pub publish --dry-run
