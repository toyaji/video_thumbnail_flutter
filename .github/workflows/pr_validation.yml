name: PR Validation

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  FLUTTER_VERSION: "3.50.1"

jobs:
  lint_and_test:
    name: Lint & Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: Install dependencies
        run: |
          flutter pub get
          cd example && flutter pub get

      - name: Prevent lint ignores
        run: |
          if grep -rn 'ignore_for_file' lib/ test/ example/lib/ example/test/ example/integration_test/; then
            echo "::error::Fix the lint instead of adding ignore_for_file."
            exit 1
          fi

      - name: Format
        run: dart format --output=none --set-exit-if-changed lib test example/lib example/test example/integration_test

      - name: Analyze
        run: |
          flutter analyze
          cd example && flutter analyze

      - name: Test
        run: |
          flutter test
          cd example && flutter test

  android_build:
    name: Android Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: zulu
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: Build Android example
        working-directory: example
        run: flutter build apk --release

  ios_spm_build:
    name: iOS Build (Swift Package Manager)
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v7

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: Build iOS example with SPM only
        working-directory: example
        run: |
          flutter config --enable-swift-package-manager
          test ! -e ios/Podfile
          flutter build ios --no-codesign
          test ! -e ios/Podfile

  pub_publish_check:
    name: pub.dev Publishing Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Verify pub.dev publishing
        run: flutter pub publish --dry-run
