name: video_thumbnail_flutter
description: Creates a JPEG, PNG or WebP thumbnail from a local video file or a video URL on Android and iOS. Supports Swift Package Manager.
version: 1.0.0
homepage: https://github.com/toyaji/video_thumbnail_flutter
repository: https://github.com/toyaji/video_thumbnail_flutter
issue_tracker: https://github.com/toyaji/video_thumbnail_flutter/issues
topics:
  - video
  - thumbnail
  - image

environment:
  sdk: ^3.7.0
  # Swift Package Manager 플러그인이 FlutterFramework 패키지에 의존하는 구조가 3.44부터다.
  flutter: ">=3.44.0"

dependencies:
  flutter:
    sdk: flutter

dev_dependencies:
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter

flutter:
  plugin:
    platforms:
      android:
        package: xyz.justsoft.video_thumbnail
        pluginClass: VideoThumbnailPlugin
      ios:
        pluginClass: VideoThumbnailPlugin
